[project]
name = "cerberus-osint"
version = "0.3.0"
description = "Descoberta horizontal de domínios com OSINT passivo"
license = "MIT"
readme = "README.md"
authors = [{ name = "Retr0Gabriel" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=1.9",
    "httpx2>=2.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
